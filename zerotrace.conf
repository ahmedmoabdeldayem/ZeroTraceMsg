; ============================================================
; ZeroTraceMsg — operator configuration
; ============================================================
; Lines starting with ; or # are comments.
; All settings are optional — omitting a line keeps the default.
; [protocol] settings must match across every server and client
; in the same deployment or messages will fail to decrypt.
; [local] settings only affect the machine they are set on.


; ============================================================
[server]
; ============================================================

; TCP port the server listens on.                    [protocol]
port = 9999

; Network interface to bind to.
; 0.0.0.0 = all interfaces, 127.0.0.1 = loopback only.
bind_address = 0.0.0.0

; Maximum number of registered users (0 = unlimited).
; Set a low number to keep a private server invitation-only.
max_users = 0

; Maximum number of simultaneous TCP connections (0 = unlimited).
; Excess connections are rejected immediately to prevent resource exhaustion.
max_connections = 1000

; Maximum number of messages queued per recipient inbox.
; Senders get ERR when the inbox is full.
max_inbox_messages = 100

; How long a session token stays valid, in hours (0 = never expires).
; Shorter values force clients to re-register more often.
session_ttl_hours = 24

; How long undelivered messages are kept on the server, in hours.  [protocol]
msg_ttl_hours = 48

; How often the server purges expired messages and sessions, in minutes.
cleanup_interval_min = 10

; Per-user rate limit: maximum messages sent within the window.
rate_limit_msgs = 20

; Duration of the rate-limit window, in seconds.
rate_limit_window_s = 60

; Path to the TLS certificate (PEM).
; Created automatically on first run if the file does not exist.
cert_path = certs/server.cert.pem

; Path to the TLS private key (PEM).
; Created automatically on first run if the file does not exist.
key_path = certs/server.key.pem

; SQLite database file for persistent storage of users, messages, and sessions.
; Empty string = in-memory database (wiped on restart — only useful for tests).
db_path = zerotrace.db

; Admin port — binds to 127.0.0.1 only; used by msg_admin CLI.
; Set to 0 to disable the admin interface entirely.
admin_port = 9998


; ============================================================
[client]
; ============================================================

; Default server address (hostname or IP).
; Overridden by the command-line argument: ./msg_client <user> <server_ip>
server = 127.0.0.1

; Server port to connect to.                         [protocol]
port = 9999

; How often the client polls the server for new messages, in seconds.
poll_interval_s = 3

; How long received messages are kept in memory before being wiped, in seconds.
msg_ttl_s = 120

; Directory where encrypted identity files are stored.
identity_dir = users/

; TCP connection timeout, in seconds.
; The client gives up and exits if the server does not respond within this time.
connection_timeout_s = 10

; Whether the client automatically retries after a dropped connection.
; Options: true | false
reconnect_on_disconnect = true


; ============================================================
[tls]
; ============================================================

; Minimum TLS version accepted.
; 1.3 is strongly recommended; allow 1.2 only for legacy client compatibility.
; Options: 1.2 | 1.3
min_version = 1.3

; Algorithm used when generating a self-signed server certificate.
; ECDSA-P256 is the default and most compatible.
; Options: ECDSA-P256 | ECDSA-P384 | Ed25519
cert_algorithm = ECDSA-P256

; Validity period of the auto-generated certificate, in days.
; 365 (one year) is the recommended maximum for production.
cert_validity_days = 365


; ============================================================
[crypto]
; ============================================================

; Key encapsulation mechanism used for per-message key exchange.  [protocol]
;
; Post-quantum (recommended):
;   ML-KEM-512          — NIST PQC standard, 128-bit security
;   ML-KEM-768          — NIST PQC standard, 192-bit security  ← default
;   ML-KEM-1024         — NIST PQC standard, 256-bit security
;
; Classical (legacy):
;   ECDH-P256           — ECDH over NIST P-256
;   ECDH-P384           — ECDH over NIST P-384
;
; Hybrid post-quantum + classical (belt-and-suspenders):
;   HYBRID-P256-ML-KEM-768    — ECDH P-256 + ML-KEM-768
;   HYBRID-P384-ML-KEM-1024   — ECDH P-384 + ML-KEM-1024
;
kem = ML-KEM-768

; Authenticated encryption cipher used to encrypt each message.   [protocol]
; Options: AES-256-GCM | AES-128-GCM | ChaCha20Poly1305
cipher = AES-256-GCM

; Hash function used in HKDF key derivation.                      [protocol]
; Options: SHA-256 | SHA-384 | SHA-512 | SHA3-256
hash = SHA-256

; Fixed size all plaintexts are padded to before encryption, in KB. [protocol]
; Larger values hide message length better but increase bandwidth.
; Must be the same across all clients and the server.
padded_plaintext_kb = 4

; ── Passphrase KDF (used to encrypt identity files at rest) ──────────────────
;
; Key derivation function for protecting identity files with a passphrase.  [local]
; Options: Argon2id | PBKDF2
passphrase_kdf = Argon2id

; For Argon2id: time cost (number of passes, e.g. 1–10).
; For PBKDF2:   iteration count (e.g. 200000–600000).
passphrase_kdf_cost = 3

; For Argon2id only: memory usage in KB (e.g. 65536 = 64 MB).
; Ignored for PBKDF2.
passphrase_kdf_memory_kb = 65536

; For Argon2id only: number of parallel threads (e.g. 1–4).
; Ignored for PBKDF2.
passphrase_kdf_parallelism = 1


; ============================================================
[logging]
; ============================================================

; Minimum log level to emit.
; Options: debug | info | warn | error
level = info

; Log destination. Leave empty to write to stdout.
; Set to a file path to append logs there instead.
; Example: file = /var/log/zerotrace.log
file =

; Log output format.
; text — human-readable (default)
; json — structured JSON, one object per line (for ELK, Splunk, etc.)
; Options: text | json
format = text
