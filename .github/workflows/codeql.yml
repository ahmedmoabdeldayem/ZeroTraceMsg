name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Re-scan every Monday at 03:00 UTC to catch newly published vulnerability patterns
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: CodeQL (C/C++)
    # Run on Linux: CodeQL's C++ extractor runs natively on x86_64 Linux,
    # avoiding the Rosetta arm64/x86_64 mismatch that breaks macOS builds.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ make python3

      - uses: ./.github/actions/setup-botan

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          # security-and-quality catches both CVEs and code-quality issues
          queries: security-and-quality

      - name: Build for analysis
        run: make all

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
