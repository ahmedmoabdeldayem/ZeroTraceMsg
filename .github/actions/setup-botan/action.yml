name: Setup Botan
description: Restore Botan from cache, or build and cache it. Works on macOS and Linux.

runs:
  using: composite
  steps:
    - name: Cache Botan
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          include/
          lib/
          bin/
        key: botan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('botan-src/configure.py', 'botan-src/src/build-data/version.txt') }}

    - name: Build Botan
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd botan-src
        ./configure.py --prefix="$GITHUB_WORKSPACE"
        make -j$(sysctl -n hw.logicalcpu 2>/dev/null || nproc)
        make install
        cd ..
        if [ "$(uname)" = "Darwin" ]; then
          codesign --force --sign - lib/libbotan-3.dylib
        fi

    - name: Re-sign Botan (macOS only)
      if: steps.cache.outputs.cache-hit == 'true' && runner.os == 'macOS'
      shell: bash
      run: codesign --force --sign - lib/libbotan-3.dylib
